<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #messages {
      width: 100%;
      height: 100vh;
    }

    .order-card {
      background: white;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .qr-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 2rem;
    }

    .qr-container img {
      max-width: 100%;
      max-height: 100vh;
      height: auto;
      object-fit: contain;
    }

    .timestamp {
      width: 100%;
      color: #666;
      font-size: 1.2em;
      text-align: center;
      padding: 1rem;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div id="messages"></div>

  <script>
    const eventSource = new EventSource('http://localhost:3000/order-app/sse');
    const messagesDiv = document.getElementById('messages');

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      messagesDiv.innerHTML = `
        <div class="order-card">
          <div class="qr-container">
            <img src="${data.order.qrCode}" alt="QR Code" />
          </div>
          <div class="timestamp">
            Order received: ${new Date(data.timestamp).toLocaleString()}
          </div>
        </div>
      `;
    };

    eventSource.onerror = (error) => {
      console.error('SSE error:', error);
      eventSource.close();
    };
  </script>
</body>
</html>
