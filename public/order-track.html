<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Order Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div id="order-details" class="bg-white rounded-lg shadow-xl overflow-hidden max-w-md w-full">
        <div class="p-6 space-y-6">
            <!-- QR Code -->
            <div class="flex justify-center qr-container" id="qr-container">
                <img src="/placeholder.svg?height=200&width=200" alt="QR Code" class="w-48 h-48">
            </div>

            <!-- Order Details Card -->
            <div id="order-card" class="bg-gray-50 rounded-lg p-6">
                <h2 class="text-xl font-bold mb-4">Order Details</h2>
                <!-- Notification Button -->
                <div class="text-center mb-4">
                    <button onclick="registerForPushNotifications()"
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Notify me when order is ready
                    </button>
                </div>
                <div class="space-y-2">
                    <p><span class="font-semibold">Order ID:</span> #12345</p>
                    <p><span class="font-semibold">Date:</span> Jan 12, 2025</p>
                    <p><span class="font-semibold">Total:</span> $99.99</p>
                    <p><span class="font-semibold">Status:</span> <span class="text-green-600">Confirmed</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        async function registerForPushNotifications() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                console.log('Push notifications not supported');
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') return;

            const registration = await navigator.serviceWorker.register('/service-worker.js');
            await subscribe(registration);
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/\-/g, '+')
                .replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribe(registration) {
            try {
                // Get public key - make sure this matches your server's VAPID public key exactly
                const publicKey = 'BGzj9TAPd2I43Zm-7go_HRjLmL3Jj9CmYzIjNQfbm_E_8CExGtgBDOZEI6D8ujJBpft_Vn_faJM-yUrWF1LA7EA';
                
                // Remove any whitespace from the key
                const cleanKey = publicKey.trim();
                console.log('Cleaned public key:', cleanKey);
                
                try {
                    const applicationServerKey = urlBase64ToUint8Array(cleanKey);
                    console.log('Converted key array length:', applicationServerKey.length);

                    // Check if we already have a subscription
                    const existingSubscription = await registration.pushManager.getSubscription();
                    if (existingSubscription) {
                        await existingSubscription.unsubscribe();
                    }

                    const subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey
                    });

                    console.log('Push subscription successful:', subscription);

                    // Send to server
                    const response = await fetch(`/order-app/subscribe/${orderId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            orderId, 
                            subscription: subscription.toJSON() 
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Server responded with ${response.status}`);
                    }
                } catch (conversionError) {
                    console.error('Key conversion error:', conversionError);
                    throw conversionError;
                }
            } catch (error) {
                console.error('Subscription error:', error);
                throw error;
            }
        }

        // SSE Implementation
        if (!!window.EventSource) {
            const source = new EventSource('http://localhost:3000/order-app/sse-ready/' + orderId);

            source.onmessage = function (event) {
                console.log(event);
                const data = JSON.parse(event.data);
                const orderCard = document.getElementById('order-card');
                const qrContainer = document.getElementById('qr-container');

                qrContainer.innerHTML = `
                    <img src="${data.order.qrCode}" alt="QR Code" class="w-48 h-48">
                `;

                orderCard.innerHTML = `
                    <h2 class="text-xl font-bold mb-4">Order Details</h2>
                    <!-- Notification Button -->
                    <div class="text-center mb-4">
                        <button onclick="registerForPushNotifications()"
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                            Notify me when order is ready
                        </button>
                    </div>
                    <div class="space-y-2">
                        <p><span class="font-semibold">Order ID:</span> ${data.order.id}</p>
                        <p><span class="font-semibold">Date:</span> ${new Date(data.timestamp).toLocaleString()}</p>
                        <p><span class="font-semibold">Total:</span> ${data.order.totalPrice}</p>
                        <p><span class="font-semibold">Status:</span> <span class="text-green-600">${data.order.status}</span></p>
                    </div>
                `;
            };

            source.onerror = function (error) {
                console.error("SSE Error:", error);
            };
        } else {
            console.error("Your browser doesn't support SSE");
        }
    </script>
</body>

</html>
